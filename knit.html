        const k = n / 6 - 2;
        rows.push(row([k ? group([['X', k], ['A', 1]], 6) : single('A', 6)], n === 18 ? '記得塞棉' : ''));
        n -= 6;

      rows[rows.length - 1].note = (rows[rows.length - 1].note ? rows[rows.length - 1].note + '；' : '') + '收口，穿線拉緊';

  /* ---------------- 雲端同步（Supabase：knit_projects） ---------------- */
  const SYNC_KEY = 'stitchnote_sync_v1', TABLE = 'knit_projects';
  const sync = { client: null, ready: false, busy: false, timer: null, dirty: new Set(), deleted: new Set(), lastPull: null, missing: false };
  try { const s0 = JSON.parse(localStorage.getItem(SYNC_KEY) || '{}'); sync.dirty = new Set(s0.dirty || []); sync.deleted = new Set(s0.deleted || []); sync.lastPull = s0.lastPull || null; } catch {}
  function keepSync() { try { localStorage.setItem(SYNC_KEY, JSON.stringify({ dirty: [...sync.dirty], deleted: [...sync.deleted], lastPull: sync.lastPull })); } catch {} }
  function status(text, kind = '') { const el = $('saveState'); if (el) { el.textContent = text; el.className = kind; } }
  const hhmm = () => new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
  function schedulePush() {
    if (!sync.ready) { status(sync.missing ? '尚未建立雲端資料表，目前只存在這台裝置（請執行 knit.sql）' : '已暫存在這台裝置，登入後會同步到雲端', sync.missing ? 'warn' : ''); return; }
    if (!sync.dirty.size && !sync.deleted.size) return;
    status('有變更，準備同步…');
    clearTimeout(sync.timer); sync.timer = setTimeout(pushNow, 1200);
  }
  async function pushNow() {
    if (!sync.ready || sync.busy) { if (sync.busy) { clearTimeout(sync.timer); sync.timer = setTimeout(pushNow, 800); } return; }
    const snap = new Map([...sync.dirty].map(id => [id, (projects.find(p => p.id === id) || {})._ts]));
    const dels = [...sync.deleted];
    const rows = [...snap.keys()].map(id => projects.find(p => p.id === id)).filter(Boolean).map(p => ({ user_id: sync.uid, id: p.id, data: p, deleted: false }));
    dels.forEach(id => rows.push({ user_id: sync.uid, id, data: {}, deleted: true }));
    if (!rows.length) { sync.dirty.clear(); keepSync(); return; }
    sync.busy = true; status('同步中…');
    try {
      const { error } = await sync.client.from(TABLE).upsert(rows, { onConflict: 'user_id,id' });
      if (error) throw error;
      snap.forEach((ts, id) => { const p = projects.find(x => x.id === id); if (!p || p._ts === ts) sync.dirty.delete(id); });
      dels.forEach(id => sync.deleted.delete(id));
      keepSync();
      status('已同步到雲端 · ' + hhmm(), 'ok');
      sync.failed = false;
    } catch (e) {
      sync.failed = true;
      if (/knit_projects|schema cache/i.test(e.message || '')) { sync.ready = false; sync.missing = true; status('尚未建立雲端資料表，目前只存在這台裝置（請執行 knit.sql）', 'warn'); }
      else status('暫時無法連線，變更已存在這台裝置，稍後會自動重試', 'warn');
    } finally {
      sync.busy = false;
      if (sync.ready && (sync.dirty.size || sync.deleted.size)) { clearTimeout(sync.timer); sync.timer = setTimeout(pushNow, sync.failed ? 15000 : 1200); }
    }
  }
  function merge(rows) {
    let changed = false;
    for (const r of rows) {
      if (!sync.lastPull || r.updated_at > sync.lastPull) sync.lastPull = r.updated_at;
      const i = projects.findIndex(p => p.id === r.id);
      if (r.deleted) { if (i >= 0 && !sync.dirty.has(r.id)) { projects.splice(i, 1); changed = true; } continue; }
      if (sync.deleted.has(r.id)) continue;
      const remote = r.data; if (!remote || !remote.parts) continue;
      if (i < 0) { projects.unshift(remote); changed = true; }
      else if ((remote._ts || 0) > (projects[i]._ts || 0)) { projects[i] = remote; sync.dirty.delete(r.id); changed = true; }
    }
    if (!projects.length) { projects = sample(); changed = true; }
    if (!projects.some(p => p.id === ui.projectId)) { ui.projectId = projects[0].id; ui.partId = projects[0].parts[0]?.id; ui.row = 0; }
    keepSync();
    if (changed) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(projects)); } catch {} safeRender(); }
  }
  async function pull(all) {
    let q = sync.client.from(TABLE).select('id,data,deleted,updated_at');
    if (!all && sync.lastPull) q = q.gt('updated_at', sync.lastPull);
    const { data, error } = await q.order('updated_at', { ascending: true });
    if (error) throw error;
    return data || [];
  }
  async function startSync() {
    sync.client = window.dailyClient;
    if (!sync.client) { status('已暫存在這台裝置（目前沒有連上雲端）'); return; }
    try { const { data: u } = await sync.client.auth.getUser(); sync.uid = u.user.id; } catch { status('已暫存在這台裝置（還沒登入）'); return; }
    status('正在從雲端讀取…');
    try {
      const rows = await pull(true);
      sync.ready = true; sync.missing = false;
      const cloud = new Set(rows.map(r => r.id));
      merge(rows);
      // 第一次同步：這台裝置有、雲端沒有的專案，全部上傳
      projects.forEach(p => { if (!cloud.has(p.id)) { if (!p._ts) p._ts = Date.now(); sync.dirty.add(p.id); } });
      keepSync();
      if (sync.dirty.size || sync.deleted.size) await pushNow(); else status('已同步到雲端 · ' + hhmm(), 'ok');
      setInterval(async () => {
        if (document.hidden || !sync.ready || sync.busy) return;
        try { merge(await pull(false)); if (sync.dirty.size || sync.deleted.size) pushNow(); } catch {}
      }, 20000);
    } catch (e) {
      if (/knit_projects|schema cache/i.test(e.message || '')) { sync.missing = true; status('尚未建立雲端資料表，目前只存在這台裝置（請執行 knit.sql）', 'warn'); }
      else { status('暫時無法連線，先用這台裝置的資料', 'warn'); setTimeout(startSync, 30000); }
    }
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden && sync.ready && (sync.dirty.size || sync.deleted.size)) pushNow(); else if (!document.hidden && sync.ready) pull(false).then(merge).catch(() => {}); });
  // 正在打字時不要重畫畫面，等離開輸入框再更新
  function safeRender() { const a = document.activeElement; if (a && a.closest && a.closest('#main input,#main textarea,#main select,#side input')) { ui.pendingRender = true; return; } render(); }

  }

  function diagram(pt, v, L) {

  function interpret(text, craft) {
    const L = craft === 'knitting' ? KNIT : CROCHET, rows = [], errs = [];
    text.split(/\n+/).forEach((line, li) => {
      let s = line.trim(); if (!s) return;
      const m = s.match(/^(?:R|Rnd|Round|Row|第)?\s*(\d+)(?:\s*[-–~～]\s*(\d+))?\s*(?:圈|行|段)?\s*[:：.、)]\s*(.*)$/i);
      let from = null, to = null, body = s;
      if (m) { from = +m[1]; to = m[2] ? +m[2] : from; body = m[3]; }
      let note = '';
      const n1 = body.match(/\s*(?:\/\/|#|——|--)\s*(.*)$/); if (n1) { note = n1[1]; body = body.slice(0, n1.index); }
      try {
        const segs = parseFormula(body, L);
        if (!segs.length) throw Error('沒有針目');
        const times = from !== null ? to - from + 1 : 1;
        for (let t = 0; t < times; t++) rows.push(row(JSON.parse(JSON.stringify(segs)).map(sg => ({ ...sg, id: uid() })), t === 0 ? note : '', craft === 'knitting' ? ['燕麥亞麻', '#D6C7B2'] : undefined));
      } catch (e) { errs.push(`第 ${li + 1} 行：${e.message}`); }
    });
    if (craft === 'knitting') rows.forEach((r, i) => { r.rowSide = i % 2 ? 'WS' : 'RS'; });
    return { rows: renumber(rows), errs };
  }

      case 'applyFormula': try { const segs = parseFormula($('formulaText').value, L); if (!segs.length) throw Error('沒有輸入針目'); ui.formulaMode = false; updRow(r => { r.segments = segs; }); } catch (err) { $('formulaErr').textContent = err.message + '（可參考縮寫對照表）'; } break;
      case 'yarn': updRow(r => { r.yarnColorName = el.dataset.n; r.yarnColorHex = el.dataset.h; }); break;
      case 'addPlain': { const v = validate(pt, L), n = v[v.length - 1]?.produced || 6; appendRow([single(craftOf(P) === 'knitting' ? (pt.rows[pt.rows.length - 1]?.rowSide === 'RS' ? 'P' : 'K') : 'X', n)], `不加不減 ${n} 針`); break; }
      case 'cPlus': ui.counter++; render(); break;
      case 'cMinus': ui.counter = Math.max(0, ui.counter - 1); render(); break;
      case 'cReset': ui.counter = 0; render(); break;
      case 'finishRow': pt.rows[ui.row].completed = true; if (ui.row < pt.rows.length - 1) ui.row++; ui.counter = 0; touch(); render(); break;
      case 'shapeUpdate': ui.shape = { type: $('shType').value, max: +$('shMax').value, plain: +($('shPlain')?.value ?? 5), close: +($('shClose')?.value || 6) }; render(); break;
      case 'shapeImport': { const s = ui.shape || { type: 'sphere', max: 36, plain: 5, close: 6 }; if (craftOf(P) === 'knitting') { alert('形狀產生器是鉤針用的，請先在左邊選一個鉤針專案。'); break; } const id = uid(); P.parts.push({ id, name: { sphere: '球體', circle: '圓片', tube: '圓柱' }[s.type] + ` ${s.max} 針`, quantity: 1, workStyle: 'round', foundationType: 'mr', notes: '', rows: shapeRows(s.type, s.max, s.plain, s.close) }); ui.partId = id; ui.row = 0; ui.tab = 'work'; touch(); render(); break; }
      case 'interpRun': {
        ui.interpText = $('interpText').value; ui.interpCraft = $('interpCraft').value;
        const res = interpret(ui.interpText, ui.interpCraft), Lx = ui.interpCraft === 'knitting' ? KNIT : CROCHET, v = validate({ rows: res.rows }, Lx);
        ui.interpRes = res;
        ui.interpOut = (res.errs.length ? `<p class="warn">${res.errs.map(esc).join('<br>')}</p>` : '') + (res.rows.length ? `<div class="tbl-wrap"><table class="rows"><thead><tr><th>圈</th><th>公式</th><th>驗算</th></tr></thead><tbody>${res.rows.map((r, k) => `<tr><td class="mono">R${k + 1}</td><td class="mono">${esc(formula(r, 'code', Lx))}${r.note ? ` <span class="muted small">${esc(r.note)}</span>` : ''}</td><td class="${v[k].ok ? 'ok' : 'warn'} small">${esc(v[k].msg)}</td></tr>`).join('')}</tbody></table></div><div class="tools end"><button type="button" class="btn" data-act="interpAsPart">加到目前專案</button><button type="button" class="btn primary" data-act="interpAsProject">建立成新專案</button></div>` : '');
        render(); break;
      }
      case 'interpAsPart': case 'interpAsProject': {
        const res = ui.interpRes; if (!res?.rows.length) break;
        const craft = ui.interpCraft, id = uid(), newPart = { id, name: '判讀的織圖', quantity: 1, workStyle: craft === 'knitting' ? 'flat' : 'round', foundationType: craft === 'knitting' ? 'ch' : 'mr', notes: '', rows: res.rows };
        if (act === 'interpAsPart') { if (craftOf(P) !== craft) { alert('目前專案的類型不同，請改用「建立成新專案」。'); break; } P.parts.push(newPart); ui.partId = id; }
        else { const p = { id: uid(), title: '判讀的織圖', category: craft === 'knitting' ? '棒針織物' : '鉤針作品', hookSize: craft === 'knitting' ? '4.0mm' : '3.0mm', yarnInfo: '', updatedAt: today(), craftType: craft, parts: [newPart] }; projects.unshift(p); ui.projectId = p.id; ui.partId = id; }
        ui.row = 0; ui.tab = 'work'; ui.interpOut = ''; ui.interpRes = null; touch(); render(); break;
      }
      case 'dictAdd': ui.tab = 'work'; addAtomToRow(el.dataset.code, 1, ''); break;
      case 'print': window.print(); break;
      case 'copyText': navigator.clipboard?.writeText(exportText(P, ui.notation)).then(() => { ui.copied = true; render(); setTimeout(() => { ui.copied = false; if (ui.tab === 'export') render(); }, 2000); }); break;
      case 'dlText': { const b = new Blob([exportText(P, ui.notation)], { type: 'text/plain;charset=utf-8' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = P.title + '_織圖.txt'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); break; }
      case 'newCrochet': newProject('crochet'); break;
      case 'newKnit': newProject('knitting'); break;
      case 'exportAll': { const b = new Blob([JSON.stringify({ app: 'StitchNote', version: 1, exportedAt: new Date().toISOString(), projects }, null, 1)], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `織圖備份_${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); break; }
      case 'importAll': $('importFile').click(); break;
    }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'toGroup') { ui.toGroup = t.checked; return; }
    if (t.id === 'palCount') { ui.palCount = Math.max(1, +t.value || 1); return; }
    if (t.dataset.field) { setField(t); render(); }
  });
  document.addEventListener('input', e => { if (e.target.dataset.field && e.target.tagName === 'INPUT' && e.target.type !== 'number') setField(e.target, true); });
  function setField(t, quiet) {
    const [scope, key] = t.dataset.field.split('.'), P = proj(), pt = part(), r = curRow();
    const val = t.type === 'number' ? Math.max(1, +t.value || 1) : t.value;
    if (scope === 'p') P[key] = val; else if (scope === 'pt' && pt) pt[key] = val; else if (scope === 'r' && r) r[key] = val;
    if (scope === 'pt' && key === 'workStyle' && craftOf(P) === 'knitting') pt.rows.forEach((x, i) => { if (val === 'flat') x.rowSide = i % 2 ? 'WS' : 'RS'; else delete x.rowSide; });
    touch(); if (quiet && scope === 'p') renderSidebar();
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'formulaText') { e.preventDefault(); document.querySelector('[data-act="applyFormula"]')?.click(); }
    if (ui.tab === 'work' && !e.target.closest('input,textarea,select') && (e.key === '+' || e.key === '=')) { ui.counter++; render(); }
  });
  $('importFile').onchange = async () => {
    const f = $('importFile').files[0]; $('importFile').value = ''; if (!f) return;
    try {
      const d = JSON.parse(await f.text()), list = Array.isArray(d) ? d : d.projects;
      if (!Array.isArray(list) || !list.length || !list[0].parts) throw Error('格式不對');
      const replace = confirm(`讀到 ${list.length} 個專案。\n按「確定」＝合併到目前資料（同一專案以檔案為準）\n按「取消」＝不匯入`);
      if (!replace) return;
      for (const p of list) { const k = projects.findIndex(x => x.id === p.id); if (k >= 0) projects[k] = p; else projects.unshift(p); markDirty(p); }
      ui.projectId = list[0].id; ui.partId = list[0].parts[0]?.id; ui.row = 0; save(); render();
      alert('匯入完成！');
    } catch (err) { alert('匯入失敗：' + err.message); }
  };
  render(); save();
  if (document.documentElement.hasAttribute('data-locked')) window.addEventListener('daily-unlocked', () => setTimeout(startSync, 0), { once: true });
  else setTimeout(startSync, 0);
})();

</script>
