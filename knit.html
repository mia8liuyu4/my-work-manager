<script>
// 手作區（StitchNote）：鉤針・棒針文字織圖、針數自動驗算（資料存在這台裝置的瀏覽器）
(() => {
  'use strict';
  const STORAGE_KEY = 'stitchnote_crochet_projects_v1';
  const $ = id => document.getElementById(id);
  const uid = () => Math.random().toString(36).slice(2, 9);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const today = () => new Date().toISOString().slice(0, 10);

  /* ---------------- 針法庫：消耗 c 針 → 產生 p 針 ---------------- */
  const CROCHET = {
    X: { zh: '短針', us: 'sc', c: 1, p: 1, kind: 'base', desc: '最基本的針法，1 針鉤 1 針' },
    V: { zh: '短針加針', us: 'inc', c: 1, p: 2, kind: 'inc', desc: '同一針裡鉤 2 短針（+1）' },
    W: { zh: '一針三短針', us: '3sc in st', c: 1, p: 3, kind: 'inc', desc: '同一針裡鉤 3 短針（+2）' },
    A: { zh: '短針減針', us: 'sc2tog', c: 2, p: 1, kind: 'dec', desc: '2 針併成 1 針（−1）' },
    M: { zh: '短針三併', us: 'sc3tog', c: 3, p: 1, kind: 'dec', desc: '3 針併成 1 針（−2）' },
    T: { zh: '中長針', us: 'hdc', c: 1, p: 1, kind: 'base', desc: '高度介於短針與長針之間' },
    TV: { zh: '中長針加針', us: 'hdc inc', c: 1, p: 2, kind: 'inc', desc: '同一針鉤 2 中長針（+1）' },
    TW: { zh: '一針三中長針', us: '3hdc in st', c: 1, p: 3, kind: 'inc', desc: '同一針鉤 3 中長針（+2）' },
    TA: { zh: '中長針減針', us: 'hdc2tog', c: 2, p: 1, kind: 'dec', desc: '2 針中長針併 1 針（−1）' },
    F: { zh: '長針', us: 'dc', c: 1, p: 1, kind: 'base', desc: '掛線 1 次的長針' },
    FV: { zh: '長針加針', us: 'dc inc', c: 1, p: 2, kind: 'inc', desc: '同一針鉤 2 長針（+1）' },
    FW: { zh: '一針三長針', us: '3dc in st', c: 1, p: 3, kind: 'inc', desc: '同一針鉤 3 長針（+2）' },
    FA: { zh: '長針減針', us: 'dc2tog', c: 2, p: 1, kind: 'dec', desc: '2 針長針併 1 針（−1）' },
    E: { zh: '長長針', us: 'tr', c: 1, p: 1, kind: 'base', desc: '掛線 2 次的長長針' },

    SL: { zh: '引拔針', us: 'sl st', c: 1, p: 1, kind: 'base', desc: '收圈或移動位置用' },
    FPX: { zh: '外鉤短針', us: 'FPsc', c: 1, p: 1, kind: 'base', desc: '從前方繞過上一圈針目的柱子鉤短針，紋路凸向正面' },
    BPX: { zh: '內鉤短針', us: 'BPsc', c: 1, p: 1, kind: 'base', desc: '從後方繞過上一圈針目的柱子鉤短針，紋路凸向背面' },
    FPT: { zh: '外鉤中長針', us: 'FPhdc', c: 1, p: 1, kind: 'base', desc: '從前方繞過柱子鉤中長針' },
    BPT: { zh: '內鉤中長針', us: 'BPhdc', c: 1, p: 1, kind: 'base', desc: '從後方繞過柱子鉤中長針' },
    FPF: { zh: '外鉤長針', us: 'FPdc', c: 1, p: 1, kind: 'base', desc: '從前方繞過柱子鉤長針，常用於羅紋、麻花' },
    BPF: { zh: '內鉤長針', us: 'BPdc', c: 1, p: 1, kind: 'base', desc: '從後方繞過柱子鉤長針，常與外鉤長針交替做羅紋' },
    FPE: { zh: '外鉤長長針', us: 'FPtr', c: 1, p: 1, kind: 'base', desc: '從前方繞過柱子鉤長長針' },
    BPE: { zh: '內鉤長長針', us: 'BPtr', c: 1, p: 1, kind: 'base', desc: '從後方繞過柱子鉤長長針' }
  };
  const KNIT = {
    K: { zh: '下針', us: 'k', c: 1, p: 1, kind: 'base', desc: '正面看到 V 字的平針' },
    P: { zh: '上針', us: 'p', c: 1, p: 1, kind: 'base', desc: '正面看到橫條顆粒' },
    KTBL: { zh: '扭下針', us: 'k tbl', c: 1, p: 1, kind: 'base', desc: '從針目後方入針織下針' },
    SL: { zh: '滑針', us: 'sl', c: 1, p: 1, kind: 'base', desc: '不織，直接移到右棒針' },
    YO: { zh: '掛針', us: 'yo', c: 0, p: 1, kind: 'inc', desc: '繞線形成洞眼加針（+1）' },
    M1L: { zh: '左扭加針', us: 'M1L', c: 0, p: 1, kind: 'inc', desc: '挑起橫線向左扭轉加針（+1）' },
    M1R: { zh: '右扭加針', us: 'M1R', c: 0, p: 1, kind: 'inc', desc: '挑起橫線向右扭轉加針（+1）' },
    KFB: { zh: '下針一針放二針', us: 'kfb', c: 1, p: 2, kind: 'inc', desc: '同一針前後各織 1 下針（+1）' },
    PFB: { zh: '上針一針放二針', us: 'pfb', c: 1, p: 2, kind: 'inc', desc: '同一針前後各織 1 上針（+1）' },
    K2tog: { zh: '左上二併', us: 'k2tog', c: 2, p: 1, kind: 'dec', desc: '2 針一起織下針，向右傾（−1）' },
    SSK: { zh: '右上二併', us: 'ssk', c: 2, p: 1, kind: 'dec', desc: '滑 2 針再一起織，向左傾（−1）' },
    P2tog: { zh: '上針二併', us: 'p2tog', c: 2, p: 1, kind: 'dec', desc: '2 針一起織上針（−1）' },
    K3tog: { zh: '左上三併', us: 'k3tog', c: 3, p: 1, kind: 'dec', desc: '3 針一起織下針（−2）' },
    S2KP: { zh: '中上三併', us: 's2kp', c: 3, p: 1, kind: 'dec', desc: '中間針在上的三併（−2）' },
    C4F: { zh: '左上 2×2 交叉', us: 'C4F', c: 4, p: 4, kind: 'cable', desc: '麻花針放前方的 4 針交叉' },
    C4B: { zh: '右上 2×2 交叉', us: 'C4B', c: 4, p: 4, kind: 'cable', desc: '麻花針放後方的 4 針交叉' },
    C6F: { zh: '左上 3×3 交叉', us: 'C6F', c: 6, p: 6, kind: 'cable', desc: '麻花針放前方的 6 針交叉' },
    C6B: { zh: '右上 3×3 交叉', us: 'C6B', c: 6, p: 6, kind: 'cable', desc: '麻花針放後方的 6 針交叉' }
  };
  const HOOKS = ['2.0mm (2/0號)', '2.3mm (3/0號)', '2.5mm (4/0號)', '3.0mm (5/0號)', '3.5mm (6/0號)', '4.0mm (7/0號)', '4.5mm (8/0號)', '5.0mm (9/0號)', '6.0mm (10/0號)', '7.0mm (7mm)', '8.0mm (8mm)', '10.0mm (10mm)'];
  const FOUND = { mr: '環起 (MR)', ch: '鎖針起針 (CH)', oval: '橢圓起針 (Oval)' };
  const YARN = [['奶油白', '#F3E5AB'], ['燕麥亞麻', '#D6C7B2'], ['焦糖棕', '#B45309'], ['鼠尾草綠', '#0F766E'], ['暖陽黃', '#EAB308'], ['珊瑚粉', '#E11D48'], ['迷霧藍', '#2563EB'], ['炭灰黑', '#292524']];
  // 判讀時把英文、中文寫法換成代號
  const ALIAS = {
    sc: 'X', '短針': 'X', '短': 'X', inc: 'V', '加針': 'V', '加': 'V', '短針加針': 'V', dec: 'A', sc2tog: 'A', invdec: 'A', '減針': 'A', '減': 'A', '短針減針': 'A',
    sc3tog: 'M', hdc: 'T', '中長針': 'T', dc: 'F', '長針': 'F', tr: 'E', '長長針': 'E', ch: 'CH', '鎖針': 'CH', 'sl st': 'SL', slst: 'SL', '引拔': 'SL', '引拔針': 'SL',
    'hdc inc': 'TV', 'dc inc': 'FV', hdc2tog: 'TA', dc2tog: 'FA',
    k: 'K', '下針': 'K', p: 'P', '上針': 'P', yo: 'YO', '掛針': 'YO', k2tog: 'K2tog', ssk: 'SSK', p2tog: 'P2tog', kfb: 'KFB', pfb: 'PFB', m1l: 'M1L', m1r: 'M1R', k3tog: 'K3tog', s2kp: 'S2KP', cdd: 'S2KP', 'k tbl': 'KTBL', ktbl: 'KTBL', sl: 'SL',
    '外鉤短針': 'FPX', fpsc: 'FPX', '內鉤短針': 'BPX', bpsc: 'BPX',
    '外鉤中長針': 'FPT', fphdc: 'FPT', '內鉤中長針': 'BPT', bphdc: 'BPT',
    '外鉤長針': 'FPF', fpdc: 'FPF', '內鉤長針': 'BPF', bpdc: 'BPF',
    '外鉤長長針': 'FPE', fptr: 'FPE', '內鉤長長針': 'BPE', bptr: 'BPE'
  };

  /* ---------------- 範例專案 ---------------- */
  const atom = (code, count = 1, loopMod) => ({ id: uid(), code, count, ...(loopMod ? { loopMod } : {}) });
  const single = (code, count, loopMod) => ({ id: uid(), type: 'single', atom: atom(code, count, loopMod) });
  const group = (items, repeat) => ({ id: uid(), type: 'group', items: items.map(([c, n]) => atom(c, n)), repeat });
  const row = (segments, note = '', color = ['奶油白', '#F3E5AB'], extra = {}) => ({ id: uid(), segments, note, completed: false, yarnColorName: color[0], yarnColorHex: color[1], ...extra });
  function sample() {
    const bear = [row([single('X', 6)], '環起 6 短針', undefined, { isFoundation: true }), row([single('V', 6)], '每針加針'), row([group([['X', 1], ['V', 1]], 6)]), row([group([['X', 2], ['V', 1]], 6)]), row([single('X', 24)], '不加不減'), row([single('X', 24)], '放安全眼於 R5'), row([group([['X', 2], ['A', 1]], 6)], '開始塞棉'), row([group([['X', 1], ['A', 1]], 6)]), row([single('A', 6)], '收口，留線縫合')];
    const knit = [row([single('K', 16)], '起針 16 針，正面全下針', ['燕麥亞麻', '#D6C7B2'], { isFoundation: true, rowSide: 'RS' }), row([single('P', 16)], '反面全上針', ['燕麥亞麻', '#D6C7B2'], { rowSide: 'WS' }), row([single('K', 2), single('C4F', 1), single('K', 4), single('C4B', 1), single('K', 2)], '麻花交叉行', ['燕麥亞麻', '#D6C7B2'], { rowSide: 'RS' }), row([single('P', 16)], '', ['燕麥亞麻', '#D6C7B2'], { rowSide: 'WS' })];
    return [
      { id: uid(), title: '小熊頭（球體範例）', category: '鉤針作品', hookSize: '3.0mm (5/0號)', yarnInfo: '五股牛奶棉', updatedAt: today(), craftType: 'crochet', parts: [{ id: uid(), name: '頭部', quantity: 1, workStyle: 'round', foundationType: 'mr', notes: 'R7 開始塞棉', rows: renumber(bear) }] },
      { id: uid(), title: '麻花樣片（棒針範例）', category: '棒針織物', hookSize: '4.0mm (棒針6號)', yarnInfo: '美麗諾羊毛', updatedAt: today(), craftType: 'knitting', parts: [{ id: uid(), name: '樣片', quantity: 1, workStyle: 'flat', foundationType: 'ch', notes: '片織往返', rows: renumber(knit) }] }
    ];
  }
  function renumber(rows) { return rows.map((r, i) => ({ ...r, rowNumber: i + 1, isFoundation: i === 0 })); }

  /* ---------------- 狀態 ---------------- */
  let projects;
  try { projects = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch { projects = null; }
  if (!Array.isArray(projects) || !projects.length) projects = sample();
  let ui = { tab: 'work', projectId: projects[0].id, partId: projects[0].parts[0]?.id, row: 0, filter: 'all', notation: 'code', formulaMode: false, counter: 0, palCount: 1, loopMod: '', groupBuf: [], groupRepeat: 6 };
  let cacheTimer=null,cachePending=false;
  function cacheDB(){return new Promise((ok,bad)=>{const r=indexedDB.open('stitchnote_large_charts',1);r.onupgradeneeded=()=>r.result.createObjectStore('cache');r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error);});}
  async function cacheRead(){const db=await cacheDB();try{return await new Promise((ok,bad)=>{const t=db.transaction('cache'),r=t.objectStore('cache').get('projects');r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)})}finally{db.close()}}
  async function cacheWrite(value){const db=await cacheDB();try{await new Promise((ok,bad)=>{const t=db.transaction('cache','readwrite');t.objectStore('cache').put(value,'projects');t.oncomplete=ok;t.onerror=()=>bad(t.error)})}finally{db.close()}}
  function mirrorProjects(){cachePending=true;clearTimeout(cacheTimer);cacheTimer=setTimeout(async()=>{const stamp=Date.now(),snapshot=structuredClone(projects);try{await cacheWrite({savedAt:stamp,projects:snapshot});cachePending=false;}catch{cachePending=false;status('大型圖解本機備份失敗，請立即匯出 JSON 備份並確認雲端同步。','warn')}},350);}
  const save = () => {try{localStorage.setItem(STORAGE_KEY,JSON.stringify(projects));localStorage.setItem(STORAGE_KEY+'_savedAt',String(Date.now()));}catch{status('大型圖解使用本機資料庫保存；請確認雲端同步並定期匯出備份。','warn')}mirrorProjects();schedulePush();};
  window.addEventListener('beforeunload',e=>{if(cachePending){e.preventDefault();e.returnValue=''}});

  const craftOf = p => {
    if (!p) return 'crochet';
    if (p.craftType) return p.craftType;
    for (const pt of p.parts || []) for (const r of pt.rows || []) {
      if (r.rowSide) return 'knitting';
      for (const s of r.segments || []) for (const a of s.atom ? [s.atom] : s.items || []) if (KNIT[a.code] && !CROCHET[a.code]) return 'knitting';
    }
    return 'crochet';
  };
  const lib = p => (craftOf(p) === 'knitting' ? KNIT : CROCHET);

  function diagram(pt, v, L) {

        for (const seg of r.segments) { const rep = seg.type === 'group' ? seg.repeat : 1; for (let k = 0; k < rep; k++) for (const a of seg.type === 'group' ? seg.items : [seg.atom]) for (let j = 0; j < a.count; j++) seq.push(a.code); }

  async function shrinkImage(file) {
    const url = URL.createObjectURL(file);

      const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(Error('圖片讀不出來')); i.src = url; });

      if (file.size > 12 * 1024 * 1024) throw Error('單張圖解上限 12MB，請先裁切成數張細節圖。');
      if (/^image\/(png|jpeg|webp)$/.test(file.type)) {
        const src = await new Promise((ok,bad)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>bad(Error('讀取失敗'));r.readAsDataURL(file)});
        return {src,w:img.naturalWidth,h:img.naturalHeight,original:true};
      }
      const k = Math.min(1, 6000 / Math.max(img.width, img.height)), c = document.createElement('canvas');

    } finally { URL.revokeObjectURL(url); }
  }

  function interpret(text, craft) {
    const L = craft === 'knitting' ? KNIT : CROCHET, rows = [], errs = [];

      if (m) { from = +m[1]; to = m[2] ? +m[2] : from; body = m[3]; }
      let note = '';
      const n1 = body.match(/\s*(?:\/\/|#|——|--)\s*(.*)$/); if (n1) { note = n1[1]; body = body.slice(0, n1.index); }
      try {
        const segs = parseFormula(body, L);
        if (!segs.length) throw Error('沒有針目');
        const times = from !== null ? to - from + 1 : 1;
        if(!Number.isInteger(times)||times<1||times>2000||rows.length+times>2000)throw Error('圈列範圍需遞增，總數上限 2000');

      } catch (e) { errs.push(`第 ${li + 1} 行：${e.message}`); }
    });
    if (craft === 'knitting') rows.forEach((r, i) => { r.rowSide = i % 2 ? 'WS' : 'RS'; });
    return { rows: renumber(rows), errs };
  }

      case 'newCrochet': newProject('crochet'); break;
      case 'newKnit': newProject('knitting'); break;
      case 'exportAll': { const b = new Blob([JSON.stringify({ app: 'StitchNote', version: 1, exportedAt: new Date().toISOString(), projects }, null, 1)], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `織圖備份_${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); break; }
      case 'importAll': $('importFile').click(); break;
    }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if(t.id==='chartShape'){const c=curChart();if(c){c.shape=t.value;ui.markPoints=false;touch();render()}return;}
    if(t.id==='guideRow'){const c=curChart();if(c){const old=structuredClone(ringOf(c));c.guideRow=Math.max(1,Math.min(2000,Math.floor(+t.value||1)));if(!c.guides[c.guideRow])c.guides[c.guideRow]=old;touch();render()}return;}
    if(t.dataset.guide){const c=curChart();if(c){const k=t.dataset.guide;ringOf(c)[k]=Math.max(k==='cx'||k==='cy'?0:.001,Math.min(k==='cx'||k==='cy'?1:2,+t.value/100||0));touch();drawRing(c)}return;}
    if (t.id === 'toGroup') { ui.toGroup = t.checked; return; }
    if (t.id === 'palCount') { ui.palCount = Math.max(1, +t.value || 1); return; }
    if (t.dataset.field) { setField(t); render(); }
  });
  document.addEventListener('input', e => { if (e.target.dataset.field && e.target.tagName === 'INPUT' && e.target.type !== 'number') setField(e.target, true); });
  function setField(t, quiet) {
    const [scope, key] = t.dataset.field.split('.'), P = proj(), pt = part(), r = curRow();
    const val = t.type === 'number' ? Math.max(1, +t.value || 1) : t.value;
    if (scope === 'p') P[key] = val; else if (scope === 'pt' && pt) pt[key] = val; else if (scope === 'r' && r) r[key] = val;
    if (scope === 'pt' && key === 'workStyle' && craftOf(P) === 'knitting') pt.rows.forEach((x, i) => { if (val === 'flat') x.rowSide = i % 2 ? 'WS' : 'RS'; else delete x.rowSide; });
    touch();
    if (quiet && scope === 'p' && key === 'title') { const s = document.querySelector('#side .proj.on strong'); if (s) s.textContent = val; }
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'formulaText') { e.preventDefault(); document.querySelector('[data-act="applyFormula"]')?.click(); }
    if (ui.tab === 'work' && !e.target.closest('input,textarea,select') && (e.key === '+' || e.key === '=')) { ui.counter++; render(); }
  });
  $('importFile').onchange = async () => {
    const f = $('importFile').files[0]; $('importFile').value = ''; if (!f) return;
    try {
      const d = JSON.parse(await f.text()), list = Array.isArray(d) ? d : d.projects;
      if (!Array.isArray(list) || !list.length || !list[0].parts) throw Error('格式不對');
      const replace = confirm(`讀到 ${list.length} 個專案。\n按「確定」＝合併到目前資料（同一專案以檔案為準）\n按「取消」＝不匯入`);
      if (!replace) return;
      for (const p of list) { const k = projects.findIndex(x => x.id === p.id); if (k >= 0) projects[k] = p; else projects.unshift(p); markDirty(p); }
      ui.projectId = list[0].id; ui.partId = list[0].parts[0]?.id; ui.row = 0; save(); render();
      alert('匯入完成！');
    } catch (err) { alert('匯入失敗：' + err.message); }
  };
  function applyView() {
    const st = $('vstage'), P = proj(), c = (P.charts || []).find(x => x.id === ui.chartId), v = ui.view;
    if (!st || !c) return;
    st.style.transform = `translate(${v.x}px,${v.y}px) scale(${v.z}) rotate(${c.rot || 0}deg)`;
    const zv = document.querySelector('.zv'); if (zv) zv.textContent = Math.round(v.z * 100) + '%';
  }
  document.addEventListener('change', e => { if (e.target.id === 'chartFile' || e.target.id === 'chartFile2') { addCharts([...e.target.files]); e.target.value = ''; } });
  document.addEventListener('input', e => { if (e.target.dataset.chart === 'name') { const c = (proj().charts || []).find(x => x.id === ui.chartId); if (c) { c.name = e.target.value; touch(); } } if (e.target.id === 'interpText') ui.interpText = e.target.value; });
  document.addEventListener('paste', e => {
    if (ui.tab !== 'interp') return;
    const files = [...(e.clipboardData?.items || [])].filter(i => i.type.startsWith('image/')).map(i => i.getAsFile()).filter(Boolean);
    if (files.length) { e.preventDefault(); addCharts(files); }
  });
  document.addEventListener('dragover', e => { if (ui.tab === 'interp' && e.target.closest('#dropzone,#viewer')) e.preventDefault(); });
  document.addEventListener('drop', e => { if (ui.tab === 'interp' && e.target.closest('#dropzone,#viewer')) { e.preventDefault(); addCharts([...e.dataTransfer.files]); } });
  // 所有標記共用圖片座標：縮放、旋轉、手機與桌面仍保持同一相對位置。
  function chartPoint(x,y){const v=$('viewer').getBoundingClientRect(),im=$('vstage').querySelector('img'),c=curChart(),a=-(c.rot||0)*Math.PI/180;const dx=x-(v.left+v.width/2+ui.view.x),dy=y-(v.top+v.height/2+ui.view.y);return {x:.5+(dx*Math.cos(a)-dy*Math.sin(a))/(im.clientWidth*ui.view.z),y:.5+(dx*Math.sin(a)+dy*Math.cos(a))/(im.clientHeight*ui.view.z)};}
  let pan=null,pointers=new Map(),pinch=null;
  document.addEventListener('pointerdown',e=>{const vw=e.target.closest('#viewer');if(!vw)return;const c=curChart();if(!c)return;const q=chartPoint(e.clientX,e.clientY);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});vw.setPointerCapture(e.pointerId);e.preventDefault();
    if(pointers.size===2){const [a,b]=[...pointers.values()];pinch={distance:Math.hypot(a.x-b.x,a.y-b.y),z:ui.view.z,x:ui.view.x,y:ui.view.y,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};pan=null;return;}
    const point=e.target.dataset.point;let kind={vruler:'ruler',vring:'move',vcenter:'move',vsize:'size'}[e.target.id]||(point!==undefined?'point':'pan');
    if(ui.markPoints&&chartMode(proj(),c)==='free'&&kind==='pan'){const g=ringOf(c);if(g.points.length<64){g.points.push({x:Math.max(0,Math.min(1,q.x)),y:Math.max(0,Math.min(1,q.y))});touch();drawRing(c)}return;}
    pan={id:e.pointerId,kind,point:+point,q,x:e.clientX,y:e.clientY,vx:ui.view.x,vy:ui.view.y,g:structuredClone(ringOf(c))};
  });
  document.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&pointers.size===2){const [a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y);ui.view.z=Math.max(.1,Math.min(24,pinch.z*d/Math.max(1,pinch.distance)));ui.view.x=pinch.x+(a.x+b.x)/2-pinch.mx;ui.view.y=pinch.y+(a.y+b.y)/2-pinch.my;applyView();return;}if(!pan||pan.id!==e.pointerId)return;const c=curChart(),g=ringOf(c),q=chartPoint(e.clientX,e.clientY),clamp=n=>Math.max(0,Math.min(1,n));
    if(pan.kind==='pan'){ui.view.x=pan.vx+e.clientX-pan.x;ui.view.y=pan.vy+e.clientY-pan.y;applyView()}
    else if(pan.kind==='ruler'){c.ruler=clamp(q.y);$('vruler').style.top=c.ruler*100+'%'}
    else if(pan.kind==='move'){const dx=q.x-pan.q.x,dy=q.y-pan.q.y;g.cx=clamp(pan.g.cx+dx);g.cy=clamp(pan.g.cy+dy);g.points=(pan.g.points||[]).map(p=>({x:clamp(p.x+dx),y:clamp(p.y+dy)}));drawRing(c)}
    else if(pan.kind==='size'){g.rx=Math.max(.005,Math.abs(q.x-g.cx));g.ry=Math.max(.005,Math.abs(q.y-g.cy));drawRing(c)}
    else if(pan.kind==='point'){g.points[pan.point]={x:clamp(q.x),y:clamp(q.y)};drawRing(c)}
  });
  function endPointer(e){pointers.delete(e.pointerId);if(pan&&pan.kind!=='pan')touch();pan=null;if(pointers.size<2)pinch=null;}
  document.addEventListener('pointerup',endPointer);document.addEventListener('pointercancel',endPointer);
  document.addEventListener('wheel',e=>{const vw=e.target.closest('#viewer');if(!vw)return;e.preventDefault();const rect=vw.getBoundingClientRect(),x=e.clientX-rect.left-rect.width/2,y=e.clientY-rect.top-rect.height/2,old=ui.view.z;ui.view.z=Math.min(24,Math.max(.1,old*(e.deltaY<0?1.12:1/1.12)));const ratio=ui.view.z/old;ui.view.x=x-(x-ui.view.x)*ratio;ui.view.y=y-(y-ui.view.y)*ratio;applyView();},{passive:false});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.readerFull){ui.readerFull=false;render()}});

  (async()=>{try{const cached=await cacheRead(),stamp=Number(localStorage.getItem(STORAGE_KEY+'_savedAt')||0);if(cached?.projects?.length&&cached.savedAt>stamp){projects=cached.projects;ui.projectId=projects[0].id;ui.partId=projects[0].parts[0]?.id;ui.row=0}}catch{}render();save();
    if(document.documentElement.hasAttribute('data-locked'))window.addEventListener('daily-unlocked',()=>setTimeout(startSync,0),{once:true});else setTimeout(startSync,0);
  })();

})();

</script>
<script>if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script><noscript>請啟用 JavaScript 才能使用。</noscript>
