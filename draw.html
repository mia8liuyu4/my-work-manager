<!doctype html>

<html lang="zh-Hant">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>餐廳抽籤機器</title>

<style>
:root{--ink:#33485f;--muted:#64768b;--mint:#7DCCAD;--pink:#F599C6;--yellow:#FFEA88}*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:var(--ink);font-family:"Microsoft JhengHei",system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:40px 24px}h1{font-size:32px;letter-spacing:-1px;margin:0 0 10px}h2{font-size:20px;margin:0 0 18px}p{line-height:1.7;margin:0}.muted,small{color:var(--muted);font-size:14px}.text-center{text-align:center}.tabs{display:flex;gap:8px;padding:6px;background:#e8edf3;border-radius:18px;max-width:340px;margin:28px auto}.tabs button{flex:1;border:0;background:transparent}.tabs button[aria-selected=true]{background:#fff;box-shadow:0 3px 10px #33485f15}.card{background:white;border:1px solid #e6ebf1;border-radius:24px;padding:28px;margin-bottom:22px;box-shadow:0 6px 24px #33485f05}button,input{font:inherit}button{min-height:44px;border:1px solid #dce4ec;background:white;color:var(--ink);border-radius:12px;padding:10px 18px;cursor:pointer;transition:background .18s,transform .18s,box-shadow .18s}button:hover:not(:disabled){background:#edf6f2;transform:translateY(-1px)}button:active:not(:disabled){transform:scale(.98)}button.primary{background:#4D6787;color:white;border-color:transparent}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #7DCCAD;outline-offset:3px}#content{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}#content>.card:first-child{position:sticky;top:24px;background:#eff9f4;text-align:center;border-color:#dcefe5;min-height:340px;padding-top:44px}#content>.card:first-child h2{font-size:25px}.draw.primary{background:var(--mint);color:#204d3c;width:100%;font-size:19px;font-weight:700;padding:18px;margin:28px 0 16px;border-radius:16px}.result{font-size:23px;font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}.result:not(:empty){padding:22px;background:#fff4bc;border-radius:16px;margin:8px 0 18px;animation:reveal .3s ease}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}small{display:block;line-height:1.7;margin-top:16px}.item{border-top:1px solid #edf0f4;padding:18px 0}.item strong{font-size:18px;overflow-wrap:anywhere}.item p{margin:8px 0;overflow-wrap:anywhere}.item button{padding:8px 14px}.danger{color:#a84963;background:#fff1f6;border-color:#f5dce6}.hidden{display:none!important}.notice{background:#fff8d8}#status{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#33485f;color:white;padding:12px 20px;border-radius:14px;z-index:30;max-width:calc(100% - 28px);box-shadow:0 8px 30px #33485f22}#status:empty{display:none}label.field{display:block;margin-bottom:20px}input[type=text]{display:block;margin-top:8px;width:100%;padding:13px;border:1px solid #dce4ec;border-radius:12px}fieldset{border:0;padding:0;margin:0 0 24px}legend{margin-bottom:12px}.days{display:flex;gap:8px;flex-wrap:wrap}.days label{padding:10px;background:#f1f4f8;border-radius:10px;cursor:pointer}.days label:has(input:checked){background:var(--mint);color:#204d3c}.days input{accent-color:#3d7a60}summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}details p{margin:12px 0 20px}dialog{width:min(540px,calc(100% - 24px));border:0;border-radius:24px;padding:28px;color:var(--ink);max-height:90vh;overflow:auto;box-shadow:0 24px 80px #22334430}dialog::backdrop{background:#25374b65;backdrop-filter:blur(4px)}dialog[open]{animation:reveal .2s ease}.dialog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.dialog-top h2{margin:0}.dialog-top button{border:0;background:#f0f3f6}.undo{margin-left:12px;background:#fff;color:#33485f;padding:5px 12px;min-height:34px}.rolling{opacity:.7}@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:720px){main{padding:28px 16px}h1{font-size:27px}#content{display:block}#content>.card:first-child{position:static;min-height:0;padding-top:28px}.card{padding:22px}.item .row button{flex:1}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

</head>

<body>

<main>
<a href="index.html" style="display:inline-block;margin-bottom:24px;color:#4D6787">← 回個人主頁</a>

  <h1>🍽️ 餐廳抽籤機器</h1>

  <p class="muted text-center">公司午餐、家裡外食分開管理，輕鬆決定今天吃什麼！</p>



  <div class="tabs" role="tablist" aria-label="餐廳地點">

    <button id="companyTab" role="tab" aria-selected="true" aria-controls="content">🏢 公司</button>

    <button id="homeTab" role="tab" aria-selected="false" aria-controls="content">🏠 家裡</button>

  </div>



  <div id="status" role="status" aria-live="polite"></div>



  <section id="migration" class="card notice hidden">

    <h2>🔄 找到舊版餐廳清單</h2>

    <p>請選擇舊資料要放在哪個分頁。原始資料會保留不受影響。</p>

    <div class="row" style="margin-top: 12px;">

      <button id="migrateCompany" class="primary">匯入公司</button>

      <button id="migrateHome" class="primary">匯入家裡</button>

    </div>

  </section>



  <div id="content" role="tabpanel" aria-labelledby="companyTab">



    <!-- 抽籤卡片 -->

    <section class="card">

      <h2 id="drawTitle">公司 · 今天吃什麼？</h2>

      <p id="count" class="muted"></p>

      <button id="draw" class="primary draw">🎲 幫我選一家</button>

      <div id="result" class="result" role="status" aria-live="polite"></div>

      <small>💡 系統會依當天日期自動排除公休餐廳；實際營業狀況請另行確認。</small>

    </section>



    <!-- 列表卡片 -->

    <section class="card">

      <div class="row between" style="margin-bottom: 12px;">

        <h2 id="listTitle" style="margin:0;">公司餐廳</h2>

        <button id="newRestaurant" class="primary" style="background: var(--palette-mint); border-color: var(--palette-mint); color: #0f4c34;">＋ 新增餐廳</button>

      </div>

      <div id="list"></div>

    </section>




  </div>



  <!-- 備份卡片 -->

  <section class="card">

    <details>

      <summary>⚙️ 資料備份與還原</summary>

      <p class="muted">資料僅保存在目前瀏覽器中。換裝置前請先匯出；還原備份會取代目前公司與家裡的清單。</p>

      <div class="row">

        <button id="export">📥 匯出備份</button>

        <button id="import">📤 匯入備份</button>

        <input type="file" id="file" accept=".json,application/json" hidden>

      </div>

    </details>

  </section>



  <p class="muted text-center" style="font-size: 13px;">

    公司與家裡的清單分開儲存。清除瀏覽器資料可能會刪除清單，請定期備份。

  </p>

<dialog id="editor" aria-labelledby="editorTitle"><div class="dialog-top"><h2 id="editorTitle">新增餐廳</h2><button type="button" id="closeDialog" aria-label="關閉">✕</button></div><form id="form"><label class="field">餐廳名稱<input id="name" type="text" maxlength="100" required placeholder="例如：巷口便當"></label><label class="field">特色／備註<input id="info" type="text" maxlength="500" placeholder="步行時間、推薦餐點…"></label><fieldset><legend>固定公休日 <span class="muted">未勾選表示無固定公休</span></legend><div id="days" class="days"></div></fieldset><p id="formError" role="alert" class="danger"></p><div class="row"><button type="submit" class="primary">儲存餐廳</button><button type="button" id="cancel">取消</button></div></form></dialog>
</main>



<script>

'use strict';

const KEY='restaurant-picker-v2',days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],dayLabels=['日','一','二','三','四','五','六'];

const $=id=>document.getElementById(id);let active='company',editId=null,legacy=[],data={version:2,company:[],home:[],legacyImported:false},storageOK=true;

const id=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);

function validateList(list){if(!Array.isArray(list))throw Error('餐廳清單格式錯誤');return list.map(r=>{if(!r||typeof r.name!=='string'||!r.name.trim()||!Array.isArray(r.closed)||r.closed.some(d=>!days.includes(d))||(r.info!==undefined&&typeof r.info!=='string'))throw Error('餐廳資料格式錯誤');return {id:typeof r.id==='string'&&r.id?r.id:id(),name:r.name.trim().slice(0,100),info:(r.info||'').slice(0,500),closed:[...new Set(r.closed)]}})}

try{const saved=localStorage.getItem(KEY);if(saved){const parsed=JSON.parse(saved);if(parsed.version!==2)throw Error('版本不符');data={version:2,company:validateList(parsed.company),home:validateList(parsed.home),legacyImported:!!parsed.legacyImported}}const old=localStorage.getItem('restaurants');if(old&&!data.legacyImported)legacy=validateList(JSON.parse(old));}catch(e){storageOK=false;message('資料讀取失敗，未覆寫原始資料。請先確認瀏覽器儲存或備份。')}

let toastTimer,drawTimer,drawGeneration=0;function message(text){clearTimeout(toastTimer);$('status').textContent=text;if(text)toastTimer=setTimeout(()=>$('status').replaceChildren(),5500)}

function commit(next){if(!storageOK){message('目前無法安全儲存，請先匯出備份並檢查瀏覽器。');return false}try{localStorage.setItem(KEY,JSON.stringify(next));data=next;return true}catch(e){message('儲存失敗：空間不足或瀏覽器限制，請先匯出備份。');return false}}

function today(){return days[new Date().getDay()]}

function render(){const label=active==='company'?'公司':'家裡';$('companyTab').setAttribute('aria-selected',active==='company');$('homeTab').setAttribute('aria-selected',active==='home');$('content').setAttribute('aria-labelledby',active+'Tab');$('drawTitle').textContent=label+' · 今天吃什麼？';$('listTitle').textContent=label+'餐廳';const list=data[active],available=list.filter(r=>!r.closed.includes(today()));$('count').textContent=`星期${dayLabels[new Date().getDay()]} · 共 ${list.length} 家，今天可抽 ${available.length} 家`;$('draw').disabled=!available.length;$('list').replaceChildren();if(!list.length){const p=document.createElement('p');p.className='muted';p.style.textAlign='center';p.style.padding='20px 0';p.textContent='還沒有餐廳，點「＋ 新增餐廳」建立清單。';$('list').append(p)}list.forEach(r=>{const div=document.createElement('div');div.className='item';const name=document.createElement('strong');name.textContent=r.name;const note=document.createElement('p');note.textContent=r.info||'未填寫備註';const closed=document.createElement('p');closed.className='muted';closed.textContent=(r.closed.includes(today())?'今天公休 · ':'')+(r.closed.length?'公休：'+r.closed.map(d=>'星期'+dayLabels[days.indexOf(d)]).join('、'):'無固定公休');const row=document.createElement('div');row.className='row';const edit=document.createElement('button');edit.textContent='編輯';edit.onclick=()=>openEditor(r);const del=document.createElement('button');del.textContent='刪除';del.className='danger';del.onclick=()=>{const place=active,index=data[place].findIndex(x=>x.id===r.id);const next={...data,[place]:data[place].filter(x=>x.id!==r.id)};if(commit(next)){if(editId===r.id)closeEditor();clearTimeout(drawTimer);drawGeneration++;$('result').textContent='';$('draw').textContent='🎲 幫我選一家';render();message('已刪除 '+r.name);const undo=document.createElement('button');undo.className='undo';undo.textContent='復原';undo.onclick=()=>{const list=[...data[place]];list.splice(Math.min(index,list.length),0,r);if(commit({...data,[place]:list})){render();message('已復原 '+r.name)}};$('status').append(undo)}};row.append(edit,del);div.append(name,note,closed,row);$('list').append(div)});$('migration').classList.toggle('hidden',!legacy.length||data.legacyImported)}

for(let n=1;n<=7;n++){const i=n%7,label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.name='closed';input.value=days[i];label.append(input,document.createTextNode(' 星期'+dayLabels[i]));$('days').append(label)}

function closeEditor(){if($('editor').open)$('editor').close();$('form').reset();$('formError').textContent='';editId=null}
function openEditor(r=null){editId=r?.id||null;$('form').reset();$('formError').textContent='';$('name').value=r?.name||'';$('info').value=r?.info||'';document.querySelectorAll('[name=closed]').forEach(c=>c.checked=!!r?.closed.includes(c.value));$('editorTitle').textContent=(active==='company'?'公司':'家裡')+' · '+(r?'編輯餐廳':'新增餐廳');$('editor').showModal();$('name').focus()}
$('closeDialog').onclick=closeEditor;$('editor').addEventListener('cancel',e=>{e.preventDefault();closeEditor()});$('editor').addEventListener('click',e=>{const box=$('editor').getBoundingClientRect();if(e.target===$('editor')&&(e.clientX<box.left||e.clientX>box.right||e.clientY<box.top||e.clientY>box.bottom))closeEditor()});
function switchTab(place){clearTimeout(drawTimer);drawGeneration++;$('draw').textContent='🎲 幫我選一家';$('result').classList.remove('rolling');active=place;closeEditor();$('result').textContent='';message('');render()}$('companyTab').onclick=()=>switchTab('company');$('homeTab').onclick=()=>switchTab('home');document.querySelectorAll('[role=tab]').forEach(b=>b.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();switchTab(active==='company'?'home':'company');$(active+'Tab').focus()}});

$('newRestaurant').onclick=()=>openEditor();$('cancel').onclick=closeEditor;

$('form').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();if(!name){$('name').focus();return}if(data[active].some(r=>r.name===name&&r.id!==editId)){$('formError').textContent='此分頁已有同名餐廳，請修改名稱。';$('name').focus();return}const r={id:editId||id(),name,info:$('info').value.trim(),closed:Array.from(document.querySelectorAll('[name=closed]:checked'),c=>c.value)};const next={...data,[active]:editId?data[active].map(x=>x.id===editId?r:x):[...data[active],r]};if(commit(next)){closeEditor();$('result').textContent='';render();message('已儲存 '+name)}};

$('draw').onclick=()=>{const available=data[active].filter(r=>!r.closed.includes(today()));if(!available.length)return;const generation=++drawGeneration,choice=available[Math.floor(Math.random()*available.length)];$('draw').disabled=true;$('draw').textContent='正在幫你挑選…';$('result').classList.add('rolling');let step=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function tick(){if(generation!==drawGeneration)return;if(step++<(reduced?0:9)){$('result').textContent=available[Math.floor(Math.random()*available.length)].name;drawTimer=setTimeout(tick,65+step*12)}else{$('result').classList.remove('rolling');$('result').textContent='今天就吃這家\n'+choice.name+(choice.info?'\n'+choice.info:'');$('draw').textContent='再抽一次';render()}}tick()};
function migrate(place){const next={...data,[place]:[...data[place],...legacy],legacyImported:true};if(commit(next)){switchTab(place);message('舊版清單已匯入，原始資料仍保留。')}}$('migrateCompany').onclick=()=>migrate('company');$('migrateHome').onclick=()=>migrate('home');$('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='餐廳清單備份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('已匯出公司與家裡的清單。')};

$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;try{if(file.size>5000000)throw Error('備份檔過大');const parsed=JSON.parse(await file.text());if(parsed.version!==2)throw Error('請使用新版匯出的備份檔');const next={version:2,company:validateList(parsed.company),home:validateList(parsed.home),legacyImported:true};if(confirm(`將取代目前清單：公司 ${next.company.length} 家、家裡 ${next.home.length} 家。建議先匯出目前資料，確定還原？`)){if(commit(next)){closeEditor();$('result').textContent='';render();message('備份還原完成。')}}}catch(e){message('匯入失敗：'+e.message)}finally{$('file').value=''}};

render();

</script>

</body>

</html>
