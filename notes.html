<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的筆記</title><style>
*{box-sizing:border-box}body{margin:0;background:#F8F5E9;color:#594539;font-family:"Microsoft JhengHei",system-ui,sans-serif}button,input,textarea{font:inherit}button,a{cursor:pointer}button{padding:10px 14px;min-height:44px;border:1px solid #e7ddc7;border-radius:10px;background:#fffdf7;color:inherit}button:hover{background:#fff1dc}button.primary{background:#a65450;color:white;border:0}button:disabled{opacity:.5;cursor:default}a{color:#a65450;text-decoration:none}header{padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fffdf7;border-bottom:1px solid #e7ddc7}header strong{font-size:20px}.spacer{flex:1}small,.muted{color:#806c5c;font-size:13px;line-height:1.8}.hidden{display:none!important}#login{max-width:440px;margin:70px auto;background:#fffdf7;padding:32px;border:1px solid #e7ddc7;border-radius:20px}label{display:block;margin:18px 0}input{padding:12px;width:100%;border:1px solid #e7ddc7;border-radius:10px;background:#fffdf7;color:inherit}label input{margin-top:8px}#workspace{display:grid;grid-template-columns:210px 260px minmax(0,1fr);min-height:calc(100vh - 100px)}aside{padding:20px;border-right:1px solid #e7ddc7}aside h2{font-size:15px;margin:0 0 16px}.list{display:flex;flex-direction:column;gap:8px;margin:16px 0}.list button{text-align:left;overflow-wrap:anywhere}.list .selected{background:#FFCA88;border-color:#e8b67b}.page-title{font-weight:700;display:block}.preview{font-size:12px;opacity:.7;display:block;margin-top:6px}#editor{background:#fffdf7;padding:30px;min-width:0}#title{font-size:26px;font-weight:700;border:0;border-radius:0;padding:12px 0;background:transparent}textarea{display:block;width:100%;min-height:55vh;resize:vertical;border:0;background:transparent;color:inherit;padding:18px 0;line-height:1.9;outline:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.danger{color:#a65450}#message{padding:10px 24px;min-height:40px;color:#9b423c;white-space:pre-wrap}#conflict{background:#fff1cd;padding:18px;border-radius:12px;margin:16px 0}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #DE7272;outline-offset:3px}@media(max-width:850px){#workspace{grid-template-columns:180px 1fr}#editor{grid-column:1/-1;border-top:1px solid #e7ddc7}}@media(max-width:520px){header{padding:14px}#workspace{display:block}aside{border-right:0;border-bottom:1px solid #e7ddc7;padding:16px}.list{max-height:180px;overflow:auto}#editor{padding:20px}#login{margin:30px 16px}#account{max-width:100%;overflow-wrap:anywhere}}

/* 使用者指定筆記色盤 */
:root{--sand:#D7C097;--cream:#E7DEAF;--leaf:#73AF6F;--teal:#007E6E}
body{background:#F5F3E7;color:#314B42}header{background:#E7DEAF;border-color:#D7C097}a{color:#006C5E}#login{background:#FFFEF7;border-color:#D7C097}button{background:#FFFEF7;border-color:#D7C097;color:#314B42}button:hover{background:#E7DEAF}button.primary{background:#007E6E;color:white}button.primary:hover{background:#00685B}aside{background:#F0EBD6;border-color:#D7C097}aside:nth-child(2){background:#F8F5E8}#editor{background:#FFFEF7;border-color:#D7C097}.list .selected{background:#73AF6F;border-color:#639D60;color:#17371D}input{background:#FFFEF7;border-color:#D7C097;color:#314B42}textarea{color:#314B42}small,.muted{color:#5D7060}#message{color:#805131}.danger{color:#8A463D}#conflict{background:#E7DEAF;color:#4E5032}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline-color:#007E6E}
</style></head><body>
<header><a href="index.html" id="home">← 首頁</a><strong>我的筆記</strong><span class="spacer"></span><small id="account"></small><button id="logout" class="hidden">登出</button></header><div id="message" role="status" aria-live="polite"></div>
<section id="login"><h1>留住每一個想法</h1><p class="muted">使用自己的帳號登入，電腦與手機共用筆記。</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" id="loginButton">登入筆記</button></form><p class="muted">第一版提供文字筆記。分類、標題與內文儲存在你的 Supabase。</p></section>
<div id="workspace" class="hidden"><aside><h2>筆記分類</h2><button id="addSection">＋ 新增分類</button><div id="sections" class="list"></div><button id="renameSection">重新命名分類</button></aside><aside><h2>分類中的頁面</h2><input id="search" placeholder="搜尋此分類的筆記" aria-label="搜尋筆記"><div class="actions"><button id="addPage">＋ 新增筆記</button><button id="refresh">同步</button></div><div id="pages" class="list"></div></aside><section id="editor"><p id="empty" class="muted">選擇或新增一篇筆記，開始記錄。</p><div id="fields" class="hidden"><input id="title" maxlength="200" aria-label="筆記標題"><small id="saveStatus" role="status" aria-live="polite"></small><div id="conflict" class="hidden"><strong>有其他裝置修改了這篇筆記，或筆記已被刪除。</strong><p>你的文字仍保留在編輯區。可先下載，再載入雲端版本；或將目前內容另存新頁。</p><div class="actions"><button id="cloud">載入雲端版本</button><button id="copy">另存新頁</button></div></div><textarea id="content" aria-label="筆記內文" placeholder="寫下會議紀錄、研究想法或生活靈感…"></textarea><div class="actions"><button id="save" class="primary">立即儲存</button><button id="download">下載這篇文字</button><button id="deletePage" class="danger">刪除筆記</button></div><p class="muted">停止輸入約 1 秒自動儲存。其他裝置的更新每 15 秒檢查一次；離線時請保留此頁並下載文字備份。</p></div></section></div>
<script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="notes.js"></script></body></html>
