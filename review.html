<link rel="icon" type="image/png" href="app-icon.png"><link rel="apple-touch-icon" href="app-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#FCF8F2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="我的日常"><title>月份回顧｜我的日常</title><style>
.review-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.cal-panel{padding:22px}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-top h2{margin:0;font-size:18px}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav button{min-width:36px;height:36px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
#reviewMsg{margin:0 0 10px;font-size:13px;color:var(--muted)}#reviewMsg:empty{display:none}
#calGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cal-day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;aspect-ratio:1/1.05;min-height:64px;padding:6px 2px;border:1.5px solid transparent;border-radius:14px;background:var(--surface2);transition:transform .12s}
.cal-day:hover{transform:translateY(-2px)}
.cal-n{align-self:flex-start;padding-left:6px;font-size:12px;color:var(--muted)}
.cal-mood{font-size:24px;line-height:1.1;min-height:26px}
.cal-badges{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.cal-badges i{font-style:normal;font-size:10px;padding:0 5px;border-radius:999px;background:var(--surface);line-height:16px}
.b-task{color:#3D6296}.b-joy{color:var(--mint-text)}
.cal-day.is-future{opacity:.45}
.cal-day.is-today{border-color:var(--accent)}
.cal-day.is-sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.m-happy{background:#FDEFC8!important}.m-calm{background:#DFF0E2!important}.m-tired{background:#EDE4F5!important}.m-sad{background:#DCEBFA!important}.m-annoyed{background:#FADADD!important}
[data-theme=minimal-dark] .m-happy{background:#3a3220!important}[data-theme=minimal-dark] .m-calm{background:#1f3326!important}[data-theme=minimal-dark] .m-tired{background:#2d2638!important}[data-theme=minimal-dark] .m-sad{background:#1e2a3a!important}[data-theme=minimal-dark] .m-annoyed{background:#3a2226!important}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
#dayDetail{margin-top:18px;padding:16px 18px;border-radius:16px;background:var(--surface2)}
.dd-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.dd-head strong{font-size:16px}.dd-mood{font-size:14px}
.dd-sec h3{margin:12px 0 6px;font-size:13px;color:var(--muted)}
.dd-sec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.6}
.dd-sec p{margin:0;font-size:13px}
.dd-joy{font-family:var(--hand);font-size:15px}
.tag{display:inline-block;padding:0 7px;border-radius:999px;font-size:11px;font-weight:700}
.tag.work{background:#E3ECF8;color:#3D6296}.tag.personal{background:var(--accent-soft);color:var(--accent-text)}
.side-col{display:flex;flex-direction:column;gap:16px}
.sum-panel,.joy-panel{padding:18px}
.sum-panel h2,.joy-panel h2{margin:0 0 12px;font-size:16px}
.sum-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum-cards div{padding:10px 12px;border-radius:14px;background:var(--surface2)}
.sum-cards b{display:block;font-size:20px}.sum-cards small{font-size:12px;color:var(--muted)}
.sum-cards a{color:inherit}
#sumLine{margin:12px 0;padding:12px 14px;border-radius:14px;background:var(--accent-soft);font-family:var(--hand);font-size:15px;line-height:1.7}
#moodBars{display:flex;flex-direction:column;gap:6px}
.mb-row{display:grid;grid-template-columns:70px 1fr 40px;align-items:center;gap:8px;font-size:13px}
.mb-row b{font-size:12px;text-align:right}
.mb-bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.mb-bar i{display:block;height:100%;border-radius:inherit;transition:width .4s}
.mb-bar i.m-happy{background:#F2C14E!important}.mb-bar i.m-calm{background:#7DBF8E!important}.mb-bar i.m-tired{background:#B79AD6!important}.mb-bar i.m-sad{background:#7EB2E6!important}.mb-bar i.m-annoyed{background:#EF8D86!important}
.pet-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px}
#reviewPet{flex-shrink:0;padding:0;border:0;background:none;cursor:pointer}
#reviewPet img{display:block;width:auto;max-width:90px;max-height:84px}
#reviewPet.bob img{animation:bob .5s cubic-bezier(.3,1.5,.6,1)}
@keyframes bob{40%{transform:translateY(-10px)}}
#reviewSay{flex:1;margin:0 0 10px;padding:10px 12px;border-radius:14px;background:var(--surface2);font-family:var(--hand);font-size:14px;line-height:1.6}
#joyRandom{width:100%;margin-bottom:12px}
#joyRandom[hidden]{display:none}
#joyWall{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:420px;overflow:auto;padding:2px}
#joyWall>p{grid-column:1/-1;margin:0;font-size:13px}
.joy-note{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;font-family:var(--hand);font-size:14px;line-height:1.5;overflow-wrap:anywhere;transform:rotate(-1deg)}
.joy-note small{font-family:var(--font);font-size:11px;color:var(--muted)}
.joy-note.n0{background:#FDEFC8}.joy-note.n1{background:#DFF0E2;transform:rotate(1deg)}.joy-note.n2{background:#FADADD}.joy-note.n3{background:#E3ECF8;transform:rotate(.5deg)}
[data-theme^=minimal] .joy-note{background:var(--surface2)!important;transform:none!important}
@media(max-width:1060px){.review-grid{grid-template-columns:1fr}.side-col{display:grid;grid-template-columns:1fr 1fr}}
@media(max-width:640px){
 .page-head{flex-wrap:nowrap}.page-head .theme-btn span{display:none}.page-head .theme-btn{padding:8px 11px}.page-head h1{font-size:21px}.page-head .sub{font-size:12px}
 .side-col{grid-template-columns:1fr}.cal-panel{padding:12px}#calGrid{gap:4px}.cal-day{min-height:52px;border-radius:10px;padding:4px 1px}.cal-mood{font-size:19px;min-height:20px}.cal-n{font-size:11px;padding-left:3px}.cal-badges i{font-size:9px;padding:0 3px}
}
